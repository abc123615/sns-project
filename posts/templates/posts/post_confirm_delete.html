{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿削除</title>
</head>
<body>
    <h1>投稿削除</h1>

    <p>「{{ post.content }}」を本当に削除しますか？</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">削除する</button>
    </form>

    <a href="{% url 'post_detail' post.pk %}">キャンセル</a>
</body>
</html>
