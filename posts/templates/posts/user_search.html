<h1>ユーザー検索</h1>

<form method="get">
    <input type="text" name="q" value="{{ query }}" placeholder="ユーザー名を入力">
    <button type="submit">検索</button>
</form>

{% if query %}
    <h2>検索結果</h2>

    {% for user in users %}
        <p>
            <a href="{% url 'profile' user.username %}">
                {{ user.username }}
            </a>
        </p>
    {% empty %}
        <p>該当するユーザーはいません。</p>
    {% endfor %}
{% endif %}

<p>
    <a href="{% url 'post_list' %}">投稿一覧に戻る</a>
</p>
