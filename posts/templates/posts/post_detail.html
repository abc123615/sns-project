<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>投稿詳細</title>
</head>
<body>
    <h1>投稿詳細</h1>

    <p>投稿者：{{ post.author.username }}</p>
    <p>{{ post.content }}</p>
    <p>投稿日：{{ post.created_at }}</p>

    {% if post.author == user %}

    <a href="{% url 'post_edit' post.pk %}">編集する</a>

    <a href="{% url 'post_delete' post.pk %}">削除する</a>

{% endif %}

    <a href="{% url 'post_list' %}">投稿一覧に戻る</a>
</body>
</html>
