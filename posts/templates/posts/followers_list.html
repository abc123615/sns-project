{% load static %}
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'posts/style.css' %}?v=6">
</head>
<body>

<h1>{{ profile.user.username }} のフォロワー</h1>

{% for follower_profile in followers %}
    <p>
        <a href="{% url 'profile' follower_profile.user.username %}">
            {{ follower_profile.user.username }}
        </a>
    </p>
{% empty %}
    <p>フォロワーはいません。</p>
{% endfor %}

<button type="button"
    data-url="{% url 'profile' profile.user.username %}"
    onclick="window.location.href=this.dataset.url"
    class="page">
    プロフィールに戻る
</button>

</body>
</html>
